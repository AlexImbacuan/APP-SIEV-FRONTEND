<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b1f5c" />

    <!-- ===== SEO básico ===== -->
    <!-- Título y descripción de la portada. Las páginas de servicio toman los suyos de
         src/data/servicios.json (scripts/prerender.js los reemplaza al compilar). -->
    <title>SIEV S.A.S. | Montajes eléctricos y tableros en Cali, Palmira y Yumbo</title>
    <meta
      name="description"
      content="SIEV S.A.S.: más de 10 años en montajes eléctricos, tableros de control y fuerza, mantenimiento eléctrico y corrección del factor de potencia en Cali, Palmira, Yumbo y el Valle del Cauca. Visita y cotización sin costo."
    />
    <link rel="canonical" href="https://sievsas.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- ===== Fuentes =====
      Se cargan sin bloquear: el texto aparece de inmediato con la fuente del sistema
      y cambia a la definitiva al terminar de descargar (display=swap).
      Barlow: landing. Exo 2 y Source Sans 3: panel interno. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=Exo+2:wght@600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;family=Exo+2:wght@600;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" /></noscript>

    <!-- ===== Íconos ===== -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ===== Vista previa al compartir (WhatsApp, Facebook, LinkedIn, X) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="SIEV" />
    <meta property="og:url" content="https://sievsas.com/" />
    <meta
      property="og:title"
      content="SIEV S.A.S. | Montajes eléctricos y tableros en Cali, Palmira y Yumbo"
    />
    <meta
      property="og:description"
      content="Montajes eléctricos, tableros de control y fuerza y mantenimiento eléctrico en Cali, Palmira, Yumbo y todo el Valle del Cauca. Visita y cotización sin costo."
    />
    <meta property="og:image" content="https://sievsas.com/images/og-siev.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="SIEV: técnico cableando un tablero eléctrico. Energía bien instalada, trabajo bien hecho."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SIEV S.A.S. | Montajes eléctricos y tableros en Cali, Palmira y Yumbo"
    />
    <meta
      name="twitter:description"
      content="Montajes eléctricos, tableros de control y fuerza y mantenimiento eléctrico en Cali, Palmira, Yumbo y todo el Valle del Cauca. Visita y cotización sin costo."
    />
    <meta name="twitter:image" content="https://sievsas.com/images/og-siev.jpg" />

  <body>
    <!-- Al compilar, scripts/prerender.js llena #root con el HTML de cada página
         (contenido visible para Google y asistentes de IA sin ejecutar JavaScript). -->
    <div id="root"></div>
