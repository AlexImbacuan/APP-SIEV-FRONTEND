[build]
  command = "npm run build"
  publish = "build"

# ===== Rutas =====
# - Portada (/) y páginas de servicio: HTML ya armado por scripts/prerender.js.
# - Login y panel: app.html (la app sin contenido prearmado, para que no se vea la portada
#   por un instante antes del panel).
# - Cualquier otra dirección responde 404 de verdad (public/404.html), para que Google
#   y los agentes de IA no reciban la portada como si fuera otra página.
# Si se agrega una ruta nueva en src/App.js, agréguela también aquí.
# (Los archivos que existen, como /sitemap.xml o /llms.txt, se sirven antes que estas reglas.)
[[redirects]]
  from = "/servicios/:slug"
  to = "/servicios/:slug.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/modulos"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/modulos/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ===== Caché del navegador =====
# Archivos del build con huella en el nombre (main.abc123.js): nunca cambian, caché de 1 año.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes: 30 días. Si se reemplaza una imagen con el mismo nombre,
# algunos visitantes la verán actualizada cuando venza la caché (o cambie el nombre).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# llms.txt: resumen de SIEV para asistentes de IA (ChatGPT, Gemini, Claude...)
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
